<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a new blog post on our platform.">
  <title>Create Blog - Blog Website</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="create.css">
  <link rel="stylesheet" href="responsive.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Blog<span>Platform</span>
      </a>
      <div class="nav-links">
        <a href="index.html"><span>Home</span></a>
      </div>
    </div>
  </nav>

  <!-- Create Blog Form -->
  <main class="container editor-section">
    <div class="page-header">
      <h1 class="page-title">Create a New Post</h1>
      <p class="page-subtitle">Share your ideas with the world.</p>
    </div>

    <div class="editor-card">
      <form id="blog-form" novalidate>
        
        <div class="form-group">
          <label for="title" class="form-label">Blog Title <span class="text-danger">*</span></label>
          <input type="text" id="title" class="form-control" placeholder="Enter a captivating title...">
          <span class="error-message"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="author" class="form-label">Author Name <span class="text-danger">*</span></label>
            <input type="text" id="author" class="form-control" placeholder="Jane Doe">
            <span class="error-message"></span>
          </div>

          <div class="form-group">
            <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
            <select id="category" class="form-control">
              <option value="" disabled selected>Select a category</option>
              <option value="Technology">Technology</option>
              <option value="Design">Design</option>
              <option value="Development">Development</option>
              <option value="Lifestyle">Lifestyle</option>
            </select>
            <span class="error-message"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="image" class="form-label">Cover Image URL</label>
          <input type="url" id="image" class="form-control" placeholder="https://example.com/image.jpg">
          <p class="text-light" style="font-size: 0.8rem; margin-top: 0.25rem;">Leave empty for a default image</p>
          
          <div class="image-preview-container" id="preview-container">
            <div class="image-placeholder" id="image-placeholder">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span>Image Preview</span>
            </div>
            <img src="" alt="Preview" class="image-preview" id="image-preview">
          </div>
        </div>

        <div class="form-group">
          <label for="content" class="form-label">Blog Content <span class="text-danger">*</span></label>
          <textarea id="content" class="form-control" placeholder="Write your amazing article here..."></textarea>
          <span class="error-message"></span>
          <div class="char-counter" id="char-counter"><span id="current-count">0</span> / 5000</div>
        </div>

        <div class="form-actions">
          <a href="index.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Publish Post</button>
        </div>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Blog Platform. Built with Vanilla JS & LocalStorage.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script src="create.js"></script>
</body>
</html>
