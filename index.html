<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, responsive blog platform built with HTML, CSS, and Vanilla JavaScript.">
  <title>Blog Website - Home</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="responsive.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Blog<span>Platform</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="active"><span>Home</span></a>
        <a href="create.html" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Create New Blog
        </a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1 class="hero-title">Discover the latest in <span>Technology & Design</span></h1>
      <p class="hero-subtitle">Read insightful articles, stay updated with modern trends, and share your own knowledge with our community.</p>
    </div>
  </section>

  <!-- Controls (Search & Filter) -->
  <section class="controls-section">
    <div class="container controls-wrapper">
      <div class="search-bar">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="Search blogs by title or author...">
      </div>
      
      <div class="category-filter">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Technology">Technology</button>
        <button class="filter-btn" data-category="Design">Design</button>
        <button class="filter-btn" data-category="Development">Development</button>
        <button class="filter-btn" data-category="Lifestyle">Lifestyle</button>
      </div>
    </div>
  </section>

  <!-- Blog Grid Section -->
  <main class="blog-section container">
    <div id="blog-grid" class="blog-grid">
      <!-- Blog cards will be dynamically injected here by home.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Blog Platform. Built with Vanilla JS & LocalStorage.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script src="home.js"></script>
</body>
</html>
